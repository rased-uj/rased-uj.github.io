 resolve(value){const entry=this.entries.get(value);if(!entry)throw Error('تعذر التحقق من الرمز في جلسة الفحص الحالية. الرموز الصادرة من جهاز أو جلسة أخرى تحتاج خادمًا مشتركًا، وهو غير مربوط بعد.');if(entry.acceptUntil<=this.clock())throw Error('انتهت صلاحية الرمز. اطلب من الطالب فتح باركوده مجددًا.');return{student:entry.student};}

}

attern="[0-9]{6}" maxlength="6" dir="ltr" required placeholder="000000"></label>`:`${mode==='signup'?`<div class="warning">الرقم الجامعي: <b>${esc(authEmail.split('@')[0])}</b><br>نطابقه مع سجل القسم بعد التحقق من البريد.</div><div class="line"></div>`:''}<label>كلمة المرور الجديدة<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><p class="form-note">١٢ حرفًا على الأقل. لا تشارك كلمة مرورك مع أي شخص.</p>`}<button class="primary wide" type="submit">${mode==='login'?'تسجيل الدخول':step===1?'إرسال كود التحقق':step===2?'التحقق والمتابعة':mode==='reset'?'تحديث كلمة المرور':'إنشاء الحساب'}</button></form>${mode==='login'?'<button class="quiet" data-action="auth" data-mode="reset">نسيت كلمة المرور؟</button>':''}<div class="line"></div><p class="form-note">${mode==='login'?'ما عندك حساب؟':'عندك حساب؟'} <button class="quiet" data-action="auth" data-mode="${mode==='login'?'signup':'login'}">${mode==='login'?'إنشاء حساب':'تسجيل الدخول'}</button></p></div></section>`;}
async function authRequest(path,data){const r=await fetch('/api/auth/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!(r.headers.get('content-type')||'').includes('application/json'))throw Error('إرسال الأكواد غير متاح بعد. نحتاج تهيئة خدمة البريد وسجل القسم؛ يمكنك الآن استعراض الأدوار من الزاوية.');const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر إتمام الطلب.');return d;}

async function load(){state=await api('/api/state');render();}
function tabs(){const staff=state.user.role!=='student';const entries=state.user.role==='supervisor'?[['review','التحضير','scan']]:staff?[['home','نظرة عامة','home'],['review','التحضير','scan'],...(state.user.role==='admin'?[['manage','الإدارة','settings']]:[]),['profile','حسابي','user']]:[['home','الرئيسية','home'],['seminars','السيمينارات','calendar'],['updates','التنبيهات والأخبار','bell'],['profile','حسابي','user']];nav.innerHTML=entries.map(([id,title,i])=>button(icon(i)+`<span>${title}</span>`,'view',`data-view="${id}" ${view===id?'aria-current="page"':''}`,view===id?'active':'')).join('');}
function updates(){return `${heading('التنبيهات والأخبار','كل جديد يهمك، في مكان واحد.')}<div class="filters">${button('التنبيهات','updatesTab','data-category="notifications"',category==='notifications'?'active':'outline')}${button('الأخبار والإعلانات','updatesTab','data-category="news"',category!=='notifications'?'active':'outline')}</div>${category==='notifications'?`<div class="stack">${state.notifications.slice().reverse().map(n=>`<article class="panel notice-card"><small>${esc(date(n.at))}</small><p>${esc(n.message)}</p></article>`).join('')||'<div class="empty">أنت مطّلع على كل جديد. لا توجد تنبيهات حاليًا.</div>'}</div>`:announcements()}`;}

function seminarCard(s){const r=state.mine.find(r=>r.seminar===s.id),reminded=state.reminders.some(r=>r.seminar===s.id);return `<article class="card"><span class="tag">${s.certificate?'ورشة':'سيمينار'} · ${esc(r?.status==='approved'?'حضور سابق معتمد':r?.status==='pending'?'بانتظار الاعتماد':s.status==='open'?'قادم':label(s.status))}</span><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p><div class="meta"><span>◷ ${esc(date(s.startsAt))}</span><span>⌖ ${esc(s.place)}</span><span>${s.countsCredit===false?'لا يُحتسب ضمن رصيد السيمينارات':'يُحتسب ضمن رصيد السيمينارات'}${s.certificate?' · شهادة بعد الاعتماد':''}</span></div>${r&&r.status!=='registered'?`<p class="status ${r.status}">${esc(label(r.status))}</p>`:''}${r?.status==='approved'?`${state.certificates.some(c=>c.seminar===s.id)?button('عرض الشهادة','certificate',`data-id="${esc(state.certificates.find(c=>c.seminar===s.id).id)}"`):'<small>لا توجد شهادة مفعّلة لهذه الفعالية.</small>'}`:r?.status==='pending'?'<small>تظهر الشهادة المؤهلة بعد اعتماد المسؤول.</small>':s.status==='open'&&Date.parse(s.startsAt)>Date.now()?`<div class="actions">${button(reminded?'إلغاء التذكير':'ذكّرني','remind',`data-id="${s.id}"`,reminded?'outline':'primary')}${button('إضافة للتقويم','calendar',`data-id="${s.id}"`,'quiet')}</div>`:''}</article>`;}

function announcements(){return `<div class="section-title"><h2>الإعلانات</h2></div><div class="stack">${state.announcements.filter(a=>a.status==='published').map(a=>`<article class="panel notice-card"><small>${esc(a.category)}</small><h3>${esc(a.title)}</h3><p class="muted">${esc(a.body)}</p>${imageGallery(a.images)}${a.publishedAt?`<small>${esc(date(a.publishedAt))}</small>`:''}</article>`).join('')||'<div class="empty">لا توجد إعلانات حاليًا.</div>'}</div>`;}

function home(){if(state.user.role!=='student')return overview();const remaining=Math.max(0,state.target-state.count),next=state.seminars.find(s=>s.status==='open'&&new Date(s.startsAt)>new Date());return `<div class="welcome"><div><span class="eyebrow">خطوة بخطوة، يكتمل رصيدك</span><h1>أهلًا، ${esc(state.user.name)}</h1><p class="muted">كل لقاء يفتح لك أفقًا جديدًا.</p></div></div><section class="hero"><div><small>رصيد السيمينارات المعتمد</small><div class="balance">${state.count}<small> / ${state.target}</small></div><progress class="progress-track" max="${state.target}" value="${Math.min(state.target,state.count)}" aria-label="رصيد الحضور"></progress><small>${state.user.legacy} سابقًا + ${state.mine.filter(r=>r.status==='approved'&&state.seminars.find(s=>s.id===r.seminar)?.countsCredit!==false).length} عبر رصيد</small></div><div class="summary"><h2>${remaining?'باقي لك '+remaining+' سيمينارات':'اكتمل رصيدك'}</h2><p><small>تابع حضورك واعتمادك بسهولة.</small></p>${button(icon('qr')+' باركودي','myQr')}<p>${button('عرض سجل حضوري','view','data-view="record"','quiet')}</p></div></section><div class="section-title"><h2>السيمينارات القادمة</h2>${button('عرض الكل ←','view','data-view="seminars"','quiet')}</div><div class="grid">${state.seminars.filter(s=>s.status==='open'&&new Date(s.startsAt)>new Date()&&!state.mine.some(r=>r.seminar===s.id&&['pending','approved'].includes(r.status))).slice(0,3).map(seminarCard).join('')||'<div class="empty">لا توجد سيمينارات قادمة حاليًا.</div>'}</div>${announcements()}`;}
function records(){return `${heading('حضوري','من المسح إلى الاعتماد، كل خطوة واضحة.')}<div class="row panel"><div><b>${state.count} من ${state.target}</b><p class="muted">${state.user.legacy} رصيد سابق · ${state.mine.filter(r=>r.status==='approved'&&state.seminars.find(s=>s.id===r.seminar)?.countsCredit!==false).length} حضور جديد معتمد</p></div>${button('تنزيل كشف PDF','print')}</div><div class="stack">${state.mine.map(r=>{const s=state.seminars.find(s=>s.id===r.seminar);return `<article class="panel"><div class="row"><div class="record-title"><div class="datebox">${new Date(s.startsAt).getDate()}</div><div><span class="status ${r.status}">${esc(label(r.status))}</span><h3>${esc(s.title)}</h3><small>${esc(date(s.startsAt))}</small></div></div></div>${r.scannedAt?`<p class="status">تم المسح: ${esc(date(r.scannedAt))}</p>`:''}<div class="actions">${r.status==='registered'?button('عرض رمز الحضور','qr',`data-id="${s.id}"`):''}${r.status==='approved'&&state.certificates.some(c=>c.seminar===s.id)?button('عرض الشهادة','certificate',`data-id="${esc(state.certificates.find(c=>c.seminar===s.id).id)}"`):''}${button('عندي مشكلة','issue',`data-id="${s.id}"`,'quiet')}</div></article>`;}).join('')||'<div class="empty">حضورك يظهر هنا بعد مسح المشرف لباركودك.</div>'}</div>`;}
function overview(){return `${heading('نظرة عامة','مراجعة تجربة رصيد ببيانات وهمية فقط.')}<div class="kpis"><div class="panel"><b>${state.students.length}</b><small>طلاب تجريبيون</small></div><div class="panel"><b>${state.registrations.filter(r=>r.status==='pending').length}</b><small>بانتظار الاعتماد</small></div><div class="panel"><b>${state.registrations.filter(r=>r.status==='approved').length}</b><small>حضور معتمد</small></div></div><div class="panel"><h3>مسار الحضور</h3><p class="muted">باركود الطالب ← مسح المشرف ← اعتماد المسؤول ← تحديث الرصيد والشهادة</p><div class="actions">${button('مراجعة الحضور','view','data-view="review"')}${state.user.role==='admin'?button('إدارة المحتوى','view','data-view="manage"','outline'):''}</div></div>${announcements()}`;}
function review(){if(state.user.role==='supervisor')return supervisorScanner();const admin=state.user.role==='admin',seminar=state.seminars.find(s=>s.id===selectedSeminar);return `${heading('التحضير والحضور','امسح باركود الطالب؛ الاعتماد النهائي عند المسؤول.')}<div class="panel"><label>الفعالية<select id="scan-seminar">${state.seminars.filter(s=>s.status!=='archived').map(s=>`<option value="${s.id}" ${s.id===selectedSeminar?'selected':''}>${esc(s.title)} · ${s.status==='open'?'متاحة للتحضير':'مغلقة'}</option>`).join('')}</select></label><div class="actions">${button('فتح الماسح بالجوال','camera',seminar?.status==='open'?'':'disabled')}${button('إدخال الرمز','scanForm','','outline')}${admin?button('اعتماد جميع المستحقين','approveAll','','outline'):''}</div><p class="form-note">المعاينة تعمل في نفس المتصفح فقط. محاكاة المسح أدناه تتيح اختبار المسار؛ الربط بين الجوالات يحتاج الخادم.</p></div><div class="stack">${state.students.map(student=>{const r=state.registrations.find(r=>r.student===student.id&&r.seminar===selectedSeminar);return `<article class="panel"><div class="row"><div><span class="status ${r?.status||''}">${r&&r.status!=='registered'?esc(label(r.status)):'لم يُمسح بعد'}</span><h3>${esc(student.name)}</h3><small>${esc(student.number)}</small></div><div class="actions">${(!r||r.status==='registered')&&seminar?.status==='open'?button('محاكاة المسح','simulateScan',`data-student="${student.id}" data-seminar="${selectedSeminar}"`):''}${r?.status==='pending'&&admin?button('اعتماد','approve',`data-id="${r.id}" data-seminar="${selectedSeminar}"`):''}${admin&&r&&r.status!=='approved'?button('حضور يدوي بسبب','manual',`data-id="${r.id}"`,'outline'):''}</div></div></article>`;}).join('')}</div>`;}

function management(){return `${heading('إدارة رصيد','المحتوى، الأرصدة السابقة، الطلبات وسجل العمليات.')}<div class="actions">${button('إضافة سيمينار','seminarForm')}${button('إعلان جديد','announcementForm')}${button('استيراد Excel','import','','outline')}${button('تقرير PDF','print','','outline')}${button('تنزيل بيانات التجربة','backup','','outline')}</div><h2>السيمينارات</h2><div class="stack">${state.seminars.map(s=>`<div class="panel"><span class="tag">${esc(label(s.status))}</span><h3>${esc(s.title)}</h3><p class="muted">${esc(date(s.startsAt))} · ${esc(s.place)}</p><div class="actions">${button('تعديل','seminarForm',`data-id="${s.id}"`,'outline')}${button(s.status==='open'?'إغلاق الفعالية':'إعادة فتح الفعالية','status',`data-id="${s.id}" data-status="${s.status==='open'?'closed':'open'}"`,'outline')}${button('أرشفة','status',`data-id="${s.id}" data-status="archived"`,'quiet')}</div></div>`).join('')}</div><h2>الإعلانات</h2><div class="stack">${state.announcements.map(a=>`<div class="panel row"><div><span class="tag">${esc(a.category)} · ${esc(label(a.status))}</span><h3>${esc(a.title)}</h3><small>${a.audience==='all'?'كل الطلاب':'فئة تجريبية محددة'}</small></div>${button('تعديل / أرشفة','announcementForm',`data-id="${a.id}"`,'outline')}</div>`).join('')}</div><h2>طلبات «عندي مشكلة»</h2><div class="stack">${state.issues.map(i=>`<div class="panel"><span class="status">${esc(i.status==="open"?"قيد المراجعة":label(i.status))}</span><h3>${esc(state.students.find(s=>s.id===i.student)?.name)}</h3><p>${esc(i.message)}</p>${i.status==='open'?button('تمت المراجعة','resolve',`data-id="${i.id}"`,'outline'):''}</div>`).join('')||'<div class="panel muted">لا توجد طلبات حاليًا.</div>'}</div><h2>سجل العمليات</h2><div class="panel table-wrap"><table><thead><tr><th>الوقت</th><th>الفاعل</th><th>العملية</th></tr></thead><tbody>${state.audit.slice().reverse().map(a=>`<tr><td>${esc(date(a.at))}</td><td>${esc(a.actor)}</td><td>${esc(a.action)}</td></tr>`).join('')}</tbody></table></div>`;}
function profile(){return `${heading('حسابي','بياناتك وسجل حضورك.')}<div class="panel"><span class="tag">${state.user.role==='student'?'طالب':state.user.role==='admin'?'مدير تجريبي':'مشرف تجريبي'}</span><h2>${esc(state.user.name)}</h2><p dir="ltr">${esc(state.user.email||'لا يوجد بريد حقيقي')}</p><p>${esc(state.user.number||'شخصية للمراجعة فقط')}</p><div class="line"></div><p class="muted">تسجيل الدخول بالبريد الجامعي وOTP واسترجاع كلمة المرور غير مفعّلة حتى تهيئة خدمة البريد والنطاقات المعتمدة. الشهادات مؤجلة لموافقة القسم.</p><div class="actions">${state.user.role==='student'?button('باركودي','myQr')+button('سجل حضوري','view','data-view="record"')+button('شهاداتي','view','data-view="certificates"'):''}${button('العودة للرئيسية','picker','','outline')}${state.user.role==='student'?button('عندي مشكلة','issue','','quiet'):''}</div></div>`;}
function render(){document.body.classList.add('workspace');document.querySelector('#bell').hidden=state.user.role==='supervisor';tabs();document.querySelector('#badge').hidden=state.notifications.length===0;document.querySelector('#badge').textContent=state.notifications.length;app.innerHTML=`<div class="demo-role-bar"><span>${state.user.role==='admin'?'تجربة المسؤول':state.user.role==='supervisor'?'تجربة مشرف الحضور':'تجربة الطالب'}</span>${button('تبديل الدور','roles','','quiet')}</div>`+(view==='home'?home():view==='seminars'?seminarsPage():view==='updates'?updates():view==='certificates'?certificates():view==='record'?records():view==='review'?review():view==='manage'?management():profile());}
async function act(body){const d=await api('/api/action',body);await load();toast(d.message||'تم حفظ التغيير.');return d;}
async function qr(){const q=await api('/api/qr',{}),image=await QRCode.toDataURL(q.value,{width:280,margin:3,errorCorrectionLevel:'M'});show(`<div class="qr"><span class="tag">باركودي الشخصي</span><h2>${esc(state.user.name)}</h2><img id="personal-qr" src="${image}" alt="باركود مرتبط بحساب الطالب"><p>اعرضه لمشرف التحضير عند حضور الفعالية.</p><p>يتجدد خلال <strong id="seconds">30</strong> ثانية</p><details><summary>الرمز النصي للاستعراض</summary><code id="qr-value">${esc(q.value)}</code>${button('نسخ الرمز','copy',`data-value="${q.value}"`,'outline')}</details><p class="form-note">رمز استعراض مرتبط بالشخصية في هذا المتصفح فقط؛ التحقق الخادمي بين الأجهزة لم يُفعّل بعد.</p></div>`);let current=q,refreshing=false;qrTimer=setInterval(async()=>{const el=document.querySelector('#seconds');if(!el)return;const n=Math.max(0,Math.ceil((current.expires-Date.now())/1000));el.textContent=n;if(!n&&!refreshing){refreshing=true;try{current=await api('/api/qr',{});const img=await QRCode.toDataURL(current.value,{width:280,margin:3,errorCorrectionLevel:'M'});if(!modal.open||!document.querySelector('#personal-qr'))return;document.querySelector('#personal-qr').src=img;document.querySelector('#qr-value').textContent=current.value;modalBody.querySelector('[data-action="copy"]').dataset.value=current.value;}catch(e){close();toast(e.message,true);}finally{refreshing=false;}}},1000);}

async function camera(facing='environment'){
 if(!window.isSecureContext)return toast('افتح الموقع عبر HTTPS لتشغيل الكاميرا.',true);
 if(!navigator.mediaDevices?.getUserMedia)return toast('افتح رابط رصيد مباشرة في Safari أو Chrome أو Edge. هذا المتصفح لا يتيح الوصول للكاميرا.',true);
 const seminar=Number(document.querySelector('#scan-seminar')?.value);if(!state.seminars.some(s=>s.id===seminar&&s.status==='open'))return toast('اختر فعالية متاحة للتحضير أولًا.',true);show(`<h2>ماسح باركود الحضور</h2><p class="form-note">${esc(state.seminars.find(s=>s.id===seminar)?.title)}</p><div class="scanner-view"><video id="camera" autoplay muted playsinline aria-label="عرض كاميرا قراءة الباركود"></video><div class="scan-guide" aria-hidden="true"></div></div><p id="camera-status" class="form-note" role="status">اسمح باستخدام الكاميرا عند ظهور طلب المتصفح…</p><div class="actions">${button('تبديل الكاميرا','flipCamera',`data-facing="${facing==='environment'?'user':'environment'}"`,'outline')}${button('إيقاف الكاميرا','stopCamera','','outline')}</div><p class="form-note">تُقرأ الصورة داخل جهازك ولا تُرفع صور الكاميرا. تحقق الحضور بين جهازين ينتظر ربط الخادم.</p>`);
 const video=document.querySelector('#camera'),status=document.querySelector('#camera-status'),session=createCameraSession({mediaDevices:navigator.mediaDevices,video});let active=true,timer=null,detector=null;
 const onVisibility=()=>{if(document.hidden){stop();if(status.isConnected)status.textContent='توقفت الكاميرا عند مغادرة الصفحة. أغلق الماسح وافتحه مجددًا للمتابعة.';}};
 const stop=()=>{active=false;clearTimeout(timer);session.stop();document.removeEventListener('visibilitychange',onVisibility);};cameraCleanup=stop;document.addEventListener('visibilitychange',onVisibility);
 try{
  if(!await session.start(facing)||!active)return;
  status.textContent='وجّه الكاميرا إلى باركود الطالب، وثبّتها لحظة.';
  if('BarcodeDetector' in window){try{const formats=await BarcodeDetector.getSupportedFormats?.();if(!formats||formats.includes('qr_code'))detector=new BarcodeDetector({formats:['qr_code']});}catch{detector=null;}}
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)throw Error('تعذر تجهيز قارئ الكاميرا.');
  const loop=async()=>{if(!active)return;try{let value='';if(video.readyState>=2&&video.videoWidth){if(detector){try{value=(await detector.detect(video))[0]?.rawValue||'';}catch{detector=null;}}if(!detector){const scale=Math.min(1,960/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);ctx.drawImage(video,0,0,canvas.width,canvas.height);const frame=ctx.getImageData(0,0,canvas.width,canvas.height);value=QRReader(frame.data,frame.width,frame.height,{inversionAttempts:'dontInvert'})?.data||'';}}
   if(value&&active){stop();close();if(!value.startsWith('RASED-REVIEW:'))return toast('هذا الرمز ليس باركود حضور صالحًا لهذه النسخة من رصيد.',true);await act({action:'scan',seminar,value});return;}
   if(active)timer=setTimeout(loop,150);
  }catch(e){stop();close();toast(e.message||'تعذرت قراءة الرمز. أعد فتح الماسح.',true);}};
  loop();
 }catch(e){stop();close();const message=({NotAllowedError:'لم يُسمح بالكاميرا. فعّل إذن الكاميرا لهذا الموقع من إعدادات المتصفح ثم افتح الماسح مجددًا.',SecurityError:'الكاميرا محجوبة بإعدادات المتصفح. افتح الموقع مباشرة وراجع الإذن.',NotFoundError:'لم نعثر على كاميرا متاحة في هذا الجهاز.',NotReadableError:'الكاميرا مشغولة أو غير متاحة. أغلق التطبيق الذي يستخدمها وحاول مجددًا.',OverconstrainedError:'تعذر اختيار الكاميرا. جرّب متصفحًا آخر أو راجع إعداداتها.'})[e.name];toast(message||'تعذر تشغيل الكاميرا. افتح الموقع مباشرة في متصفح الجوال وتأكد من الإذن.',true);}
}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;b.disabled=true;try{

 if(a==='simulateScan')await act({action:'simulateScan',student:b.dataset.student,seminar:Number(b.dataset.seminar)});
 if(a==='backup'){const data=await api('/api/backup');const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=u;link.download='rased-synthetic-demo.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}

 if(a==='manual')show(`<h2>حضور يدوي استثنائي</h2><form data-form="manual"><input type="hidden" name="registration" value="${b.dataset.id}"><label>سبب الإضافة بعد التحقق من الهوية<textarea name="reason" required maxlength="300"></textarea></label><button class="primary">اعتماد وتسجيل السبب</button></form>`);
 if(a==='issue')show(`<h2>عندي مشكلة</h2><form data-form="issue"><label>السيمينار<select name="seminar"><option value="">مشكلة عامة</option>${state.seminars.map(s=>`<option value="${s.id}" ${Number(b.dataset.id)===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select></label><label>وصف المشكلة<textarea name="message" required minlength="5" maxlength="1200"></textarea></label><button class="primary">إرسال الطلب</button></form>`);

 if(a==='import')show('<h2>استيراد الأرصدة السابقة</h2><p>استيراد ملفات الطلاب غير مفعّل في رابط معاينة التصميم. جرّب إدارة السيمينارات والإعلانات والحضور بالبيانات الوهمية المتاحة.</p>');
 if(a==='importCommit'){await api('/api/import-commit',{id:b.dataset.id});close();await load();toast('تم استبدال الأرصدة السابقة، مع حفظ سجل العملية.');}
 }catch(err){toast(err.message,true);}finally{b.disabled=false;}});

 const data=Object.fromEntries(new FormData(form));for(const k of ['id','seminar','registration'])if(k in data)data[k]=Number(data[k])||null;if(type==='seminar'){data.startsAt=new Date(data.startsAt).toISOString();data.countsCredit=data.countsCredit==='true';data.certificate=data.certificate==='true';}if(type==='announcement')data.images=draftImages;await act({...data,action:type});close();

document.addEventListener('submit',async e=>{const form=e.target;if(!form.dataset.auth)return;e.preventDefault();const submit=form.querySelector('[type="submit"]'),error=form.querySelector('#auth-error');submit.disabled=true;error.hidden=true;const fields=Object.fromEntries(new FormData(form)),mode=form.dataset.auth,step=Number(form.dataset.step);try{if(step===1){authEmail=fields.email.trim().toLowerCase();if(!/^[0-9]{7}@uj[.]edu[.]sa$/.test(authEmail))throw Error('استخدم بريدك الجامعي: ٧ أرقام ثم @uj.edu.sa.');if(mode==='login'){await authRequest('login',fields);rehearsal=false;await load();}else{const d=await authRequest('request',{email:authEmail,purpose:mode});challenge=d.challenge;authScreen(mode,2);}}else if(step===2){const d=await authRequest('verify',{challenge,code:fields.code});proof=d.proof;authScreen(mode,3);}else{await authRequest(mode==='reset'?'reset':'complete',{proof,...fields});rehearsal=false;await load();}}catch(e){error.textContent=e.message;error.hidden=false;}finally{submit.disabled=false;}});

function calendarFile(id){const s=state.seminars.find(s=>s.id===id);const safe=v=>String(v).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,x=>'\\'+x),stamp=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z');const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RASED UJ//Seminars//AR','BEGIN:VEVENT','UID:rased-'+id+'@uj.edu.sa','DTSTAMP:'+stamp(Date.now()),'DTSTART:'+stamp(s.startsAt),'DTEND:'+stamp(Date.parse(s.startsAt)+3600000),'SUMMARY:'+safe(s.title),'LOCATION:'+safe(s.place),'DESCRIPTION:'+safe(s.description),'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:تذكير بالفعالية','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');const u=URL.createObjectURL(new Blob([body],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='rased-event-'+id+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('افتح ملف التقويم لإضافة الموعد وتذكير قبل نصف ساعة.');}
document.addEventListener('change',async e=>{if(e.target.id!=='announcement-images')return;const files=[...e.target.files],submit=e.target.form.querySelector('button:not([type="button"])');submit.disabled=true;try{if(files.length>3)throw Error('أرفق حتى ٣ صور فقط.');const images=[];for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5000000)throw Error('استخدم JPG أو PNG أو WebP، أقل من ٥ ميجابايت للصورة.');const image=await createImageBitmap(file);try{if(image.width*image.height>20000000)throw Error('أبعاد الصورة كبيرة جدًا.');const scale=Math.min(1,1200/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.round(image.width*scale);canvas.height=Math.round(image.height*scale);canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);let result=canvas.toDataURL('image/jpeg',.78);if(result.length>330000)result=canvas.toDataURL('image/jpeg',.5);if(result.length>330000)throw Error('الصورة ما زالت كبيرة. قلّل حجمها ثم أرفقها.');images.push(result);}finally{image.close();}}draftImages=images;document.querySelector('#image-preview').innerHTML=imageGallery(images);}catch(err){e.target.value='';toast(err.message,true);}finally{submit.disabled=false;}});

function seminarsPage(){const statusFor=s=>state.mine.find(r=>r.seminar===s.id)?.status;const approved=state.seminars.filter(s=>statusFor(s)==='approved'),pending=state.seminars.filter(s=>statusFor(s)==='pending'),upcoming=state.seminars.filter(s=>s.status==='open'&&Date.parse(s.startsAt)>Date.now()&&!['approved','pending'].includes(statusFor(s)));const rows=seminarTab==='previous'?approved:seminarTab==='pending'?pending:upcoming;return `${heading('السيمينارات','الفعاليات القادمة، واعتماد حضورك السابق.')}<div class="filters">${button('القادمة','seminarTab','data-tab="upcoming"',seminarTab==='upcoming'?'active':'outline')}${button('بانتظار الاعتماد · '+pending.length,'seminarTab','data-tab="pending"',seminarTab==='pending'?'active':'outline')}${button('السيمينارات السابقة · '+approved.length,'seminarTab','data-tab="previous"',seminarTab==='previous'?'active':'outline')}</div><div class="grid">${rows.map(seminarCard).join('')||`<div class="empty">${seminarTab==='previous'?'تظهر هنا الفعاليات بعد اعتماد حضورك.':seminarTab==='pending'?'لا يوجد حضور بانتظار الاعتماد.':'لا توجد فعاليات قادمة حاليًا.'}</div>`}</div>`;}

function supervisorScanner(){const available=state.seminars.filter(s=>s.status==='open');if(!available.some(s=>s.id===selectedSeminar))selectedSeminar=available[0]?.id||0;const rows=state.registrations.filter(r=>r.seminar===selectedSeminar&&['pending','approved'].includes(r.status));return `${heading('التحضير والحضور','اختر الفعالية، ثم امسح الباركود الشخصي لكل طالب.')}<div class="panel"><label>الفعالية<select id="scan-seminar" ${!available.length?'disabled':''}>${available.map(s=>`<option value="${s.id}" ${s.id===selectedSeminar?'selected':''}>${esc(s.title)}</option>`).join('')||'<option>لا توجد فعاليات متاحة للتحضير</option>'}</select></label><div class="actions">${button('فتح قارئ الباركود','camera',!available.length?'disabled':'')}${button('إدخال الرمز','scanForm',!available.length?'disabled':'','outline')}</div><p class="form-note">كل فعالية متاحة تظهر تلقائيًا. إغلاق المسؤول للفعالية يزيلها من هذه القائمة.</p><p class="warning">التحقق بين أجهزة مختلفة ينتظر ربط الخادم. رموز الاستعراض الحالية صالحة داخل جلسة المتصفح التي أصدرتها فقط.</p></div><div class="section-title"><h2>الحضور الممسوح · ${rows.length}</h2></div><div class="stack">${rows.map(r=>`<article class="panel"><span class="status ${r.status}">${esc(label(r.status))}</span><h3>${esc(r.name)}</h3><small>${esc(r.number)}</small></article>`).join('')||'<div class="empty">تظهر هنا أسماء الطلاب بعد مسح باركوداتهم لهذه الفعالية.</div>'}</div>${available.length?`<details class="panel simulation"><summary>محاكاة المسح ببيانات وهمية</summary><div class="stack">${state.students.filter(s=>!rows.some(r=>r.student===s.id)).map(s=>button('محاكاة مسح '+esc(s.name),'simulateScan',`data-student="${s.id}" data-seminar="${selectedSeminar}"`,'outline')).join('')||'<p>تم مسح الطلاب الوهميين لهذه الفعالية.</p>'}</div></details>`:''}`;}
</script></body></html>
